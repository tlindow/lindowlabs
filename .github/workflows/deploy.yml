name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Build static site
        working-directory: ./site
        run: npm run build:static

      - name: Check labels against catalog
        working-directory: ./site
        run: npm run check:labels

      - name: Check em dashes in built HTML
        working-directory: ./site
        run: npm run check:em-dashes

      - name: Check essay locations
        working-directory: ./site
        run: npm run check:locations

      - name: Check phone digits are absent from export
        working-directory: ./site
        run: npm run check:phone-leak

      - name: Check mobile nav Login layout (no Visitors/LinkedIn)
        working-directory: ./site
        run: npm run check:mobile-nav

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
