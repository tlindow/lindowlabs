name: Em dash check

on:
  pull_request:
  # Allow manual re-runs when the pull_request event does not attach a suite.
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Build static site
        working-directory: ./site
        run: npm run build:static

      - name: Check labels against catalog
        working-directory: ./site
        run: npm run check:labels

      - name: Check em dashes in built HTML
        working-directory: ./site
        run: npm run check:em-dashes

      - name: Check essay locations
        working-directory: ./site
        run: npm run check:locations

      - name: Check mobile nav Login layout (no Visitors/LinkedIn)
        working-directory: ./site
        run: npm run check:mobile-nav

      - name: Check single profile photo at hero / middle / Let's talk
        working-directory: ./site
        run: npm run check:profile-photo
