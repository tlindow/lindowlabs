name: Visual QA

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  visual-qa:
    name: Visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./site
        run: npx playwright install --with-deps chromium

      - name: Build static site
        working-directory: ./site
        run: npm run build:static

      - name: Run visual QA
        id: qa
        working-directory: ./site
        run: npm run check:visual-qa
        continue-on-error: true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: site/visual-qa-output/
          if-no-files-found: warn

      - name: Publish screenshots for PR comment
        if: github.event_name == 'pull_request' && always()
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH="visual-qa/pr-${PR_NUMBER}"
          PUBLISH_DIR="$(mktemp -d)"
          mkdir -p "${PUBLISH_DIR}/screenshots"
          if [ -d site/visual-qa-output/screenshots ]; then
            cp -R site/visual-qa-output/screenshots/. "${PUBLISH_DIR}/screenshots/" || true
          fi
          if [ -f site/visual-qa-output/report.md ]; then
            cp site/visual-qa-output/report.md "${PUBLISH_DIR}/report.md"
          fi
          if [ -f site/visual-qa-output/report.json ]; then
            cp site/visual-qa-output/report.json "${PUBLISH_DIR}/report.json"
          fi
          cd "${PUBLISH_DIR}"
          git init -q
          git checkout -q -b "${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No screenshots to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Visual QA screenshots for PR #${PR_NUMBER}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${BRANCH}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Comment screenshots on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = 'site/visual-qa-output/report.json';
            let report = { ok: false, failures: [], results: [] };
            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            }
            const qaFailed = '${{ steps.qa.outcome }}' !== 'success';
            const status = qaFailed || !report.ok ? 'FAIL' : 'PASS';
            const branch = 'visual-qa/pr-${{ github.event.pull_request.number }}';
            const rawBase = `https://raw.githubusercontent.com/${{ github.repository }}/${branch}`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const shotLines = (report.results || [])
              .slice(0, 12)
              .map((r) => {
                const file = path.posix.basename(r.screenshot || '');
                const url = `${rawBase}/screenshots/${file}`;
                return `| \`${r.label}\` | [png](${url}) |`;
              })
              .join('\n');

            const failLines = (report.failures || [])
              .slice(0, 30)
              .map((f) => `- \`${f.label}\`: ${f.message}`)
              .join('\n') || '_None_';

            const body = [
              '<!-- visual-qa-bot -->',
              `## Visual QA: **${status}**`,
              '',
              `Check run: [Visual QA](${runUrl})`,
              `Artifact: \`visual-qa-screenshots\``,
              '',
              '### Failures',
              failLines,
              '',
              '### Screenshots',
              '| Case | Image |',
              '| --- | --- |',
              shotLines || '| _(none)_ | |',
              '',
              `<details><summary>More screenshots on branch \`${branch}\`</summary>`,
              '',
              `Browse: https://github.com/${{ github.repository }}/tree/${branch}/screenshots`,
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) =>
              (c.body || '').includes('<!-- visual-qa-bot -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job when visual QA failed
        if: steps.qa.outcome != 'success'
        run: |
          echo "Visual QA check failed"
          exit 1
