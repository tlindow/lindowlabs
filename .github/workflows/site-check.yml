name: Site check

# PR gate. Runs the same pipeline as `npm run check` / the pre-push hook
# (site/scripts/check-manifest.mjs), split into jobs that share one static
# build. Replaces em-dash-check.yml and visual-qa.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast (lint, typecheck, test, source scans)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-site
      - name: check.mjs --tier fast
        working-directory: ./site
        run: node scripts/check.mjs --tier fast

  build:
    name: Build static export
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-site
      - name: check.mjs --tier build
        working-directory: ./site
        run: node scripts/check.mjs --tier build
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: site-out
          path: site/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  artifact:
    name: Artifact checks (labels, em dashes, locations)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-site
      - uses: actions/download-artifact@v4.3.0
        with:
          name: site-out
          path: site/out
      - name: check.mjs --tier artifact
        working-directory: ./site
        run: node scripts/check.mjs --tier artifact

  browser:
    name: Browser checks (mobile nav, profile photo, scroll handoff)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-site
        with:
          browser: "true"
      - uses: actions/download-artifact@v4.3.0
        with:
          name: site-out
          path: site/out
      - name: check.mjs --tier browser (visual-qa runs in its own job)
        working-directory: ./site
        run: node scripts/check.mjs --tier browser --skip visual-qa

  visual-qa:
    name: Visual QA
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-site
        with:
          browser: "true"
      - uses: actions/download-artifact@v4.3.0
        with:
          name: site-out
          path: site/out

      - name: Run visual QA
        id: qa
        working-directory: ./site
        run: node scripts/check.mjs --tier browser --only visual-qa
        continue-on-error: true

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: site/visual-qa-output/
          if-no-files-found: warn

      - name: Publish screenshots for PR comment
        if: github.event_name == 'pull_request' && always()
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH="visual-qa/pr-${PR_NUMBER}"
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          PUBLISH_DIR="$(mktemp -d)"
          mkdir -p "${PUBLISH_DIR}/screenshots"
          if [ -d site/visual-qa-output/screenshots ]; then
            cp -R site/visual-qa-output/screenshots/. "${PUBLISH_DIR}/screenshots/" || true
          fi
          if [ -f site/visual-qa-output/report.md ]; then
            cp site/visual-qa-output/report.md "${PUBLISH_DIR}/report.md"
          fi
          if [ -f site/visual-qa-output/report.json ]; then
            cp site/visual-qa-output/report.json "${PUBLISH_DIR}/report.json"
          fi

          # Fork PRs (and some permission setups) cannot push branches back to
          # the base repo. Never fail the job for that — artifact + comment remain.
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Fork PR detected; skipping screenshot branch push"
            echo "push_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd "${PUBLISH_DIR}"
          git init -q
          git checkout -q -b "${BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No screenshots to publish"
            echo "push_skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Visual QA screenshots for PR #${PR_NUMBER}"
          if git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${BRANCH}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "push_skipped=false" >> "$GITHUB_OUTPUT"
          else
            echo "Screenshot branch push failed (permissions/fork); continuing with artifact only"
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "push_skipped=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Comment screenshots on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = 'site/visual-qa-output/report.json';
            let report = { ok: false, failures: [], results: [], byCategory: {} };
            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            }
            const qaFailed = '${{ steps.qa.outcome }}' !== 'success';
            const status = qaFailed || !report.ok ? 'FAIL' : 'PASS';
            const branch = 'visual-qa/pr-${{ github.event.pull_request.number }}';
            const published = '${{ steps.publish.outputs.published }}' === 'true';
            const rawBase = `https://raw.githubusercontent.com/${{ github.repository }}/${branch}`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const byCategory = report.byCategory && Object.keys(report.byCategory).length
              ? report.byCategory
              : (report.failures || []).reduce((acc, f) => {
                  const m = String(f.message || '').match(/^\[([^\]]+)\]/);
                  const type = m ? m[1] : 'other';
                  acc[type] = (acc[type] || 0) + 1;
                  return acc;
                }, {});

            const categoryLines = Object.keys(byCategory).length
              ? Object.entries(byCategory)
                  .sort(([a], [b]) => a.localeCompare(b))
                  .map(([type, count]) => `- **${type}**: ${count}`)
                  .join('\n')
              : '_None_';

            // One sample per category so every failure type is visible even when
            // the full list is long.
            const sampleByCategory = {};
            for (const f of report.failures || []) {
              const m = String(f.message || '').match(/^\[([^\]]+)\]/);
              const type = m ? m[1] : 'other';
              if (!sampleByCategory[type]) sampleByCategory[type] = [];
              if (sampleByCategory[type].length < 3) {
                sampleByCategory[type].push(`- \`${f.label}\`: ${f.message}`);
              }
            }
            const sampleLines = Object.keys(sampleByCategory).length
              ? Object.entries(sampleByCategory)
                  .sort(([a], [b]) => a.localeCompare(b))
                  .map(([type, lines]) => `**${type}**\n${lines.join('\n')}`)
                  .join('\n\n')
              : '_None_';

            let shotSection;
            if (published) {
              const shotLines = (report.results || [])
                .slice(0, 12)
                .map((r) => {
                  const file = path.posix.basename(r.screenshot || '');
                  const url = `${rawBase}/screenshots/${file}`;
                  return `| \`${r.label}\` | [png](${url}) |`;
                })
                .join('\n');
              shotSection = [
                '### Screenshots',
                '| Case | Image |',
                '| --- | --- |',
                shotLines || '| _(none)_ | |',
                '',
                `<details><summary>More screenshots on branch \`${branch}\`</summary>`,
                '',
                `Browse: https://github.com/${{ github.repository }}/tree/${branch}/screenshots`,
                '',
                '</details>',
              ].join('\n');
            } else {
              shotSection = [
                '### Screenshots',
                'Screenshot branch push was skipped (fork PR or missing `contents: write`).',
                `Download the **\`visual-qa-screenshots\`** artifact from the [check run](${runUrl}).`,
              ].join('\n');
            }

            const body = [
              '<!-- visual-qa-bot -->',
              `## Visual QA: **${status}**`,
              '',
              `Check run: [Visual QA](${runUrl})`,
              `Artifact: \`visual-qa-screenshots\``,
              '',
              '### Failures by category',
              categoryLines,
              '',
              '### Sample failures (up to 3 per category)',
              sampleLines,
              '',
              shotSection,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) =>
              (c.body || '').includes('<!-- visual-qa-bot -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job when visual QA failed
        if: steps.qa.outcome != 'success'
        run: |
          echo "Visual QA check failed"
          exit 1
