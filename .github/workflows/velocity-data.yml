name: Refresh velocity data

# Daily commit of site/src/data/velocity.json so /velocity stays current on the
# static GitHub Pages export without hand-editing. Optional repo secret
# VELOCITY_GITHUB_TOKEN (PAT with read access to beginner-work/beginner) includes
# private beginner counts/timings only; without it, public repos are refreshed.

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velocity-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch velocity stats
        env:
          VELOCITY_GITHUB_TOKEN: ${{ secrets.VELOCITY_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node site/scripts/fetch-velocity.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- site/src/data/velocity.json; then
            echo "No velocity data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/velocity.json
          git commit -m "chore: refresh velocity shipping stats"
          git push
