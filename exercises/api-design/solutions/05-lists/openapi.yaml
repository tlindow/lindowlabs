openapi: "3.0.3"
info:
  title: Payments API
  version: "1.0.0"
paths:
  /payment_intents/{id}:
    get:
      summary: Get a payment intent by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "404":
          description: Payment intent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payment_intents:
    get:
      summary: List payment intents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A page of payment intents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentList"
    post:
      summary: Create a payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntent"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "400":
          description: Invalid create payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    PaymentIntent:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    CreatePaymentIntent:
      type: object
      required:
        - amountCents
        - currency
      properties:
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
    PaymentIntentList:
      type: object
      properties:
        paymentIntents:
          type: array
          items:
            $ref: "#/components/schemas/PaymentIntent"
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
