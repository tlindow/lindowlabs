openapi: "3.0.3"
info:
  title: Payments API
  version: "1.0.0"
paths:
  /payment_intents:
    post:
      summary: Create a payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntent"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "400":
          description: Invalid create payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List payment intents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Payment intent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntentList"
  /payment_intents/{paymentIntentId}:
    get:
      summary: Get a payment intent by id
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "404":
          description: Payment intent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payment_intents/{paymentIntentId}/capture:
    post:
      summary: Capture a payment intent
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapture"
      responses:
        "201":
          description: Capture created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capture"
        "400":
          description: Invalid capture payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Payment intent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /payment_intents/{paymentIntentId}/refunds:
    post:
      summary: Refund a payment intent
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefund"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          description: Invalid refund payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Payment intent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /refunds/{refundId}:
    get:
      summary: Get a refund by id
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "404":
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/{eventId}:
    get:
      summary: Get a webhook event by id
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A webhook event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEvent"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    PaymentIntent:
      type: object
      required:
        - paymentIntentId
        - amountCents
        - currency
        - status
        - createdAt
      properties:
        paymentIntentId:
          type: string
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
        status:
          type: string
          enum:
            - requires_capture
            - succeeded
            - refunded
        createdAt:
          type: string
          format: date-time
    CreatePaymentIntent:
      type: object
      required:
        - amountCents
        - currency
      properties:
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
    PaymentIntentList:
      type: object
      properties:
        paymentIntents:
          type: array
          items:
            $ref: "#/components/schemas/PaymentIntent"
        limit:
          type: integer
        offset:
          type: integer
    Capture:
      type: object
      required:
        - captureId
        - paymentIntentId
        - amountCents
        - createdAt
      properties:
        captureId:
          type: string
        paymentIntentId:
          type: string
        amountCents:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    CreateCapture:
      type: object
      properties:
        amountCents:
          type: integer
          minimum: 1
    Refund:
      type: object
      required:
        - refundId
        - paymentIntentId
        - amountCents
        - createdAt
      properties:
        refundId:
          type: string
        paymentIntentId:
          type: string
        amountCents:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    CreateRefund:
      type: object
      required:
        - amountCents
      properties:
        amountCents:
          type: integer
          minimum: 1
    WebhookEvent:
      type: object
      required:
        - eventId
        - type
        - createdAt
        - data
      properties:
        eventId:
          type: string
        type:
          type: string
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
