openapi: "3.0.3"
info:
  title: Payments API
  version: "1.0.0"
paths:
  /merchants:
    post:
      summary: Create a merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMerchant"
      responses:
        "201":
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "400":
          description: Invalid create payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /merchants/{merchantId}:
    get:
      summary: Get a merchant by id
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Merchant"
        "404":
          description: Merchant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid create payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List orders
      parameters:
        - name: merchantId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
  /orders/{orderId}:
    get:
      summary: Get an order by id
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: An order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}/refunds:
    post:
      summary: Create a refund for an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefund"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          description: Invalid refund payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /refunds/{refundId}:
    get:
      summary: Get a refund by id
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "404":
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Merchant:
      type: object
      required:
        - merchantId
        - name
        - createdAt
      properties:
        merchantId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateMerchant:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    Order:
      type: object
      required:
        - orderId
        - merchantId
        - amountCents
        - currency
        - status
        - createdAt
      properties:
        orderId:
          type: string
        merchantId:
          type: string
        amountCents:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum:
            - created
            - paid
            - refunded
        createdAt:
          type: string
          format: date-time
    CreateOrder:
      type: object
      required:
        - merchantId
        - amountCents
        - currency
      properties:
        merchantId:
          type: string
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
    OrderList:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
    Refund:
      type: object
      required:
        - refundId
        - orderId
        - amountCents
        - createdAt
      properties:
        refundId:
          type: string
        orderId:
          type: string
        amountCents:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreateRefund:
      type: object
      required:
        - amountCents
      properties:
        amountCents:
          type: integer
          minimum: 1
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
