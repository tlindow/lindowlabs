openapi: "3.0.3"
info:
  title: Rides API
  version: "1.0.0"
security:
  - bearerAuth: []
paths:
  /rides/{id}:
    get:
      summary: Get a ride by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A ride
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "404":
          description: Ride not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rides:
    get:
      summary: List rides
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: A page of rides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideList"
    post:
      summary: Create a ride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRide"
      responses:
        "201":
          description: Ride created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
        "400":
          description: Invalid create payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Ride:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    CreateRide:
      type: object
      required:
        - pickup
        - dropoff
      properties:
        pickup:
          type: string
        dropoff:
          type: string
    RideList:
      type: object
      properties:
        rides:
          type: array
          items:
            $ref: "#/components/schemas/Ride"
        limit:
          type: integer
        offset:
          type: integer
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
