openapi: "3.0.3"
info:
  title: Payments API
  version: "1.0.0"
paths:
  /payment_intents/{id}:
    get:
      summary: Get a payment intent by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
components:
  schemas:
    PaymentIntent:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
