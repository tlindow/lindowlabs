openapi: "3.0.3"
info:
  title: Payments API
  version: "1.0.0"
paths:
  /orders/{id}:
    get:
      summary: Get an order by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: An order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders:
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    CreateOrder:
      type: object
      required:
        - merchantId
        - amountCents
        - currency
      properties:
        merchantId:
          type: string
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
