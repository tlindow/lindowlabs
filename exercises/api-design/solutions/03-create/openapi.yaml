openapi: "3.0.3"
info:
  title: Payments API
  version: "1.0.0"
paths:
  /payment_intents/{id}:
    get:
      summary: Get a payment intent by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
  /payment_intents:
    post:
      summary: Create a payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntent"
      responses:
        "201":
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
components:
  schemas:
    PaymentIntent:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
    CreatePaymentIntent:
      type: object
      required:
        - amountCents
        - currency
      properties:
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
